<template>
    <lightning-card title="Claims Adjuster Dashboard" icon-name="custom:custom62">
        <div class="slds-p-around_medium">
            <template lwc:if={claims}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={claims} for:item="claim">
                        <div key={claim.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-bottom_small">
                            <c-claim-tile-lwc claim={claim} onclaimselect={handleClaimSelect}></c-claim-tile-lwc>
                        </div>
                    </template>
                </div>
            </template>
            <template lwc:elseif={error}>
                <div class="slds-text-color_error">Error loading claims: {errorMessage}</div>
            </template>
            <template lwc:else>
                <lightning-spinner alternative-text="Loading claims..."></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
